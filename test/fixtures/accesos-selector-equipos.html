<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de equipos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="ajustes">
    <form class="formulario-agregar">
      <h3>Crear acceso</h3>
      <fieldset class="equipos-asignados-acceso">
        <legend>Equipos asignados</legend>
        <p class="ayuda-ajustes">Elegí uno o más equipos. Podés cambiar esta selección más adelante.</p>
        <div class="equipos-asignados-opciones">
          <label><input type="checkbox" checked>Administración</label>
          <label><input type="checkbox">Capacitaciones</label>
          <label><input type="checkbox">Comunicación</label>
          <label><input type="checkbox">Deportes</label>
          <label><input type="checkbox">Eventos</label>
          <label><input type="checkbox">Familias</label>
          <label><input type="checkbox">Finanzas</label>
        </div>
        <span class="equipos-asignados-cantidad">1 equipo seleccionado</span>
      </fieldset>
      <button class="boton boton-principal" type="button">Dar acceso</button>
    </form>
  </main>
</body>
</html>
