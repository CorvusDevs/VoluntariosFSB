<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auditoría móvil CMS Aletea</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #222; }
    iframe { display: block; width: 390px; height: 844px; border: 0; background: white; }
  </style>
</head>
<body>
  <iframe title="CMS Aletea en viewport móvil"></iframe>
  <pre id="resultado" hidden></pre>
  <script>
    const area = new URLSearchParams(location.search).get('area') || 'control'
    window.addEventListener('message', (evento) => {
      if (evento.origin !== location.origin || evento.data?.tipo !== 'auditoria-movil-cms') return
      const resultado = document.querySelector('#resultado')
      resultado.textContent = JSON.stringify(evento.data.resultado)
      resultado.hidden = false
    })
    document.querySelector('iframe').src = `cms-overhaul.html?area=${encodeURIComponent(area)}&mobile-audit=1&receipt=${Date.now()}`
  </script>
</body>
</html>
