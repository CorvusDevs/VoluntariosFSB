<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vista de novedades</title>
    <link rel="stylesheet" href="../../css/estilos.css">
    <style>
      body { min-height: 100vh; margin: 0; background: #faf7fc; }
      .fondo-prueba { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
      .fondo-prueba h1 { color: var(--violeta); }
      .fondo-prueba article { padding: 24px; border: 1px solid var(--linea); border-radius: 18px; background: white; }
    </style>
  </head>
  <body>
    <div id="raiz">
      <main class="fondo-prueba">
        <h1>Centro de control</h1>
        <article>
          <h2>Tus tareas de hoy</h2>
          <p>Esta pantalla debe permanecer detrás del resumen.</p>
          <button class="boton" type="button">Abrir una tarea</button>
        </article>
      </main>
    </div>
    <script type="module">
      import { crearAvisoNovedades } from '../../js/ui/pantalla-cambios.js'
      import { NOVEDADES } from '../../js/ui/novedades.js'

      const almacen = { getItem: () => '1.0.0', setItem: () => {} }
      crearAvisoNovedades(document.getElementById('raiz'), {
        novedades: NOVEDADES,
        almacenNovedades: almacen,
        alVerCambios: () => { document.body.dataset.abrioCambios = 'true' },
      })
    </script>
  </body>
</html>
