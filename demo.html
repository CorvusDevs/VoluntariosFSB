<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo de imagen - Voluntarios FSB</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<main class="demo">
  <h1>Demostración de la imagen semanal</h1>
  <p>Esta página dibuja la imagen real que se comparte por WhatsApp, con una lista de ejemplo de tamaño realista (19 filas).</p>

  <form class="demo-opciones">
    <label><input type="checkbox" id="saludo" checked> Saludo</label>
    <label><input type="checkbox" id="despedida" checked> Despedida</label>
    <label><input type="checkbox" id="fotos" checked> Fotos</label>
    <label><input type="checkbox" id="compacto"> Modo compacto</label>
  </form>

  <button type="button" id="descargar">Descargar PNG</button>

  <p id="info">Generando...</p>

  <canvas id="lienzo" class="demo-lienzo"></canvas>
</main>
<script type="module" src="js/demo.js"></script>
</body>
</html>
